# rack01 job dbkgap-zen4: wip/x264-deblock-gaps, the MBAFF deblock pointers production interlaced content reached
# below the machine's best level, on Zen 4. Arm pairs of xeone-jobs/dbkgap/dbkgap-ab.sh (AB):
#   AB=tip  base 9ef632af (tip~1: every kernel assembled, nothing new dispatched) -> arm 42c8bdbd (the dispatch
#           commit). AVX-512 machines change too: 8-bit takes the avx 4:2:0 MBAFF chroma pair (chroma_420_mbaff
#           sse2 -> avx, chroma_420_intra_mbaff mmx2 -> avx), 10-bit the avx2 luma MBAFF pair (luma(_intra)_mbaff
#           avx -> avx2); they keep the icl luma intra. This gates the merge of the tip (its Intel win, Xeon E) for
#           Zen 4 / Zen 5.
#   AB=icl  10-bit only: base 42c8bdbd -> arm 42c8bdbd with the undispatched 10-bit
#           x264_deblock_h_luma(_intra)_mbaff_avx512icl dispatched at AVX512ICL (patch_arm: the iclpatch of
#           dbkgap-ab.sh as a perl edit with assertions). The 8-bit build is untouched by it.
# Decision cells: BITDEPTH=8: field-frame-mix-i (lowlat + normal); BITDEPTH=10: field-frame-mix-i-422p10 (lowlat +
# normal). Zero-call nulls: 8-bit tile-chaos-p lowlat (progressive: no MBAFF edge) and field-frame-mix-i-422 lowlat
# (8-bit 4:2:2 MBAFF: its mixed edges go through chroma_422_mbaff = h_chroma_420, unchanged); 10-bit
# tile-chaos-p-422p10 lowlat (progressive; the Zen 4 10-bit luma intra stays icl in both arms).
# Verdict decides: AB=tip: merge wip/x264-deblock-gaps with the AVX-512 machines on the new pointers (or an
# AVX512ICL override back before the merge, per depth). AB=icl: dispatch the 10-bit icl luma MBAFF pair on Zen 4/5.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   AB=icl: zen5/x264-deblock-gaps-icl = 42c8bdbd + this job's patch_arm, committed as "zen5: dispatch deblock_h_luma(_intra)_mbaff_avx512icl (10-bit)"
#   AB=tip: no AVX-512 kernel in either arm (sse2/mmx2/avx vs avx/avx2): nothing is parked
AB=${AB:-tip}
BITDEPTH=${BITDEPTH:-8}
DBK_BASE=9ef632afa474e2d42ca463c15e9008aa5d9eb6a2
DBK_TIP=42c8bdbde4a4e14a387615cc84968d93e5902542
case $BITDEPTH:$AB in
8:tip|10:tip) BASE=$DBK_BASE; ARM=$DBK_TIP; ZEN5=""
        ARMDESC="42c8bdbd (8-bit 4:2:0 MBAFF chroma avx; 10-bit luma intra / MBAFF avx2)";;
10:icl) BASE=$DBK_TIP; ARM=$DBK_TIP
        ARMDESC="42c8bdbd with the 10-bit deblock_h_luma(_intra)_mbaff avx512icl dispatched at AVX512ICL"
        ZEN5="zen5/x264-deblock-gaps-icl = 42c8bdbd + this job's patch_arm, committed as \"zen5: dispatch deblock_h_luma(_intra)_mbaff_avx512icl (10-bit)\"";;
*) echo "dbkgap-zen4: AB=tip at BITDEPTH 8 or 10, AB=icl at 10 (got AB=$AB BITDEPTH=$BITDEPTH)" >&2; exit 1;;
esac
JOB=dbkgap-zen4-$AB-${BITDEPTH}b
TITLE="deblock gaps (MBAFF) on Zen 4, $BITDEPTH-bit: AB=$AB"
BRANCHES="wip/x264-deblock-gaps"
PERIOD=${PERIOD:-50021}   # small kernels on mixed edges: denser samples for the liveness asserts
if [ $BITDEPTH = 8 ]; then
    DEF_CLIPLIST="field-frame-mix-i"
    DEF_NULLCELLS="tile-chaos-p:lowlat field-frame-mix-i-422:lowlat"
    MD5CLIPS=${MD5CLIPS:-"fades-p tile-chaos-p pan-fast-p fades-i field-frame-mix-i credits-i"}
    LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i:normal field-frame-mix-i:lowlat"}
    LIVE_SHOW='deblock'
    LIVE_ASSERT=${LIVE_ASSERT:-'A+:deblock_h_chroma(_intra)?_mbaff_avx($|[.]) B0:deblock_h_chroma(_intra)?_mbaff_avx($|[.]) B+:deblock_h_chroma(_intra)?_mbaff_(sse2|mmx2) A0:deblock_h_chroma(_intra)?_mbaff_(sse2|mmx2)'}
    NULL_ASSERT=${NULL_ASSERT:-'A0:deblock_h_chroma(_intra)?_mbaff B0:deblock_h_chroma(_intra)?_mbaff'}
else
    DEF_CLIPLIST="field-frame-mix-i-422p10"
    DEF_NULLCELLS="tile-chaos-p-422p10:lowlat"
    DEF_MD5X=""
    MD5CLIPS=${MD5CLIPS:-"tile-chaos-p-422p10 field-frame-mix-i-422p10"}
    LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i-422p10:normal field-frame-mix-i-422p10:lowlat"}
    LIVE_SHOW='deblock'
    if [ $AB = tip ]; then
        LIVE_ASSERT=${LIVE_ASSERT:-'A+:deblock_h_luma(_intra)?_mbaff_avx2 B0:deblock_h_luma(_intra)?_mbaff_avx2 B+:deblock_h_luma(_intra)?_mbaff_avx($|[.]) A0:deblock_h_luma(_intra)?_mbaff_avx($|[.])'}
    else
        LIVE_ASSERT=${LIVE_ASSERT:-'A+:deblock_h_luma(_intra)?_mbaff_avx512icl B0:deblock_h_luma(_intra)?_mbaff_avx512icl B+:deblock_h_luma(_intra)?_mbaff_avx2 A0:deblock_h_luma(_intra)?_mbaff_avx2'}
    fi
    NULL_ASSERT=${NULL_ASSERT:-'A0:deblock_h_luma(_intra)?_mbaff B0:deblock_h_luma(_intra)?_mbaff'}
fi
patch_arm() {
    [ $AB = icl ] || return 0
    pl common/deblock.c 's|^(            /\* undispatched \(checkasm tests them at this level\): x264_deblock_h_luma_mbaff_avx512icl,\n)|            pf->deblock_luma_mbaff = x264_deblock_h_luma_mbaff_avx512icl;\n            pf->deblock_luma_intra_mbaff = x264_deblock_h_luma_intra_mbaff_avx512icl;\n${1}|m' &&
    want common/deblock.c 'pf->deblock_luma_mbaff = x264_deblock_h_luma_mbaff_avx512icl;' 1 &&
    want common/deblock.c 'pf->deblock_luma_intra_mbaff = x264_deblock_h_luma_intra_mbaff_avx512icl;' 2 &&   # this one + the 8-bit line
    before common/deblock.c 'if( cpu&X264_CPU_AVX512ICL )' 'pf->deblock_luma_mbaff = x264_deblock_h_luma_mbaff_avx512icl;' &&
    before common/deblock.c 'pf->deblock_luma_mbaff = x264_deblock_h_luma_mbaff_avx512icl;' '/* deblock_strength 1.042x, deblock_luma_mbaff 1.042x */'   # the HIGH_BIT_DEPTH half
}
