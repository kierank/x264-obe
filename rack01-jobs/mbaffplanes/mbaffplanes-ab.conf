# rack01 job mbaffplanes-ab: wip/x264-nw-mbaffplanes 2d0dbfac (memfd double-maps the field F/H picture pages onto
# the frame pages: -4.16 MB written per MBAFF ref frame) vs c664d151 (hpel_filter_vc field pass + FLD_STATS).
# Interlaced only: the progressive cells are the null control (no field planes are allocated there).
# Risk measured here: frame F/H lose THP (4K shmem pages), so dTLB cost shows in cycles:u on Zen 4.
# Liveness: no new hot symbol (the mapping is per frame allocation); the hpel_filter / copy samples are printed.
# Traffic: job mbaffplanes-mbm (needs Kieran root).
# Verdict decides: merge mbaffplanes (8-bit and 10-bit MBAFF, 4:4:4 excluded) or not.
JOB=mbaffplanes-ab
TITLE="mbaffplanes: field planes share the frame planes' pages (MBAFF)"
BRANCHES="wip/x264-nw-mbaffplanes"
BASE=c664d15125233e6832c64858ef7483a0c389e12d
ARM=2d0dbfac3c065433ef1de39f5e72d17d403c7768
ARMDESC="2d0dbfac (memfd double-mapped F/H field planes)"
DEF_CLIPLIST="fades-i field-frame-mix-i credits-i"
DEF_NULLCELLS="tile-chaos-p:normal pan-fast-p:lowlat"
MD5CLIPS="fades-p tile-chaos-p pan-fast-p fades-i field-frame-mix-i credits-i"
EXTRA_MD5="field-frame-mix-i:normal_t4 credits-i:lowlat_t4 fades-i:sub1"
LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i:normal fades-i:lowlat"}
LIVE_SHOW='hpel_filter|frame_filter|plane_copy|memcpy|frame_expand|cache_load_interlaced'
LIVE_ASSERT=${LIVE_ASSERT:-}
pkg_mode() { # mode bitrate
    case $1 in
    normal_t4) echo "$(nmopts $2) --threads 4 --frames 120 --qp 23";;
    lowlat_t4) echo "$(llopts $2) --threads 4 --frames 120 --qp 23";;
    sub1)      echo "--preset superfast --subme 1 --bframes 2 --vbv-bufsize $2 --frames 120";;
    *) return 1;;
    esac
}
