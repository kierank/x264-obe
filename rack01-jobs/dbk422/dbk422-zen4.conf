# rack01 job dbk422-zen4: wip/x264-422-deblock, 8-bit deblock_h_chroma_422(_intra) (the vertical chroma edges of
# 4:2:2: all 16 rows of the MB edge in one ymm pass) on Zen 4. Arm pairs of xeone-jobs/dbk422/dbk422-ab.sh (AB):
#   AB=tip  base baf5b648 (tip~1: kernels in, avx dispatched) -> arm beec0fb5 (the tip: avx2 dispatched at AVX2).
#           AVX-512 machines inherit the AVX2 dispatch (they ran the avx pair: the 8-bit icl was pruned), so this
#           gates the merge of the tip (its Intel AVX2 win, Xeon E) for Zen 4 / Zen 5.
#   AB=icl  base beec0fb5 -> arm beec0fb5 with the undispatched 8-bit x264_deblock_h_chroma_422(_intra)_avx512icl
#           dispatched at AVX512ICL (patch_arm: the iclpatch of dbk422-ab.sh as a perl edit with assertions).
# Decision cells: 8-bit 4:2:2 interlaced field-frame-mix-i-422 (lowlat + normal). Zero-call null: tile-chaos-p
# lowlat (8-bit 4:2:0: no h_chroma_422 edge). md5 adds every 4:2:0 clip, the other 4:2:2 interlaced clips and
# tile-chaos-p-422 (progressive 4:2:2 calls the same pointers).
# 10-bit (BITDEPTH=10, AB=tip only): the series changes no 10-bit object (all !HIGH_BIT_DEPTH), so every 10-bit cell
# is a null cell by construction (build may print "base and arm binaries are IDENTICAL": expected there); the
# report reads NO-DECISION-CELLS. ROUNDS defaults to 6 at 10-bit.
# Verdict decides: AB=tip: merge wip/x264-422-deblock with the AVX-512 machines on avx2 (or keep them on avx: a
# one-line AVX512ICL override back to avx before the merge). AB=icl: dispatch the 8-bit icl pair on Zen 4/5.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   AB=icl: zen5/x264-422-deblock-icl = beec0fb5 + this job's patch_arm, committed as "zen5: dispatch deblock_h_chroma_422(_intra)_avx512icl (8-bit)"
#   AB=tip: no AVX-512 kernel in either arm (avx vs avx2): nothing is parked
AB=${AB:-tip}
BITDEPTH=${BITDEPTH:-8}
case $BITDEPTH:$AB in
8:tip)  BASE=baf5b6483d14cfb874c6267d901657e023d959b5; ARM=beec0fb5c8cb755578d610641baedccc87b617a2
        ARMDESC="beec0fb5 (8-bit deblock_h_chroma_422(_intra) avx2 at AVX2, AVX-512 machines too)"; ZEN5="";;
8:icl)  BASE=beec0fb5c8cb755578d610641baedccc87b617a2; ARM=beec0fb5c8cb755578d610641baedccc87b617a2
        ARMDESC="beec0fb5 with the 8-bit deblock_h_chroma_422(_intra) avx512icl dispatched at AVX512ICL"
        ZEN5="zen5/x264-422-deblock-icl = beec0fb5 + this job's patch_arm, committed as \"zen5: dispatch deblock_h_chroma_422(_intra)_avx512icl (8-bit)\"";;
10:tip) BASE=baf5b6483d14cfb874c6267d901657e023d959b5; ARM=beec0fb5c8cb755578d610641baedccc87b617a2
        ARMDESC="beec0fb5 (no 10-bit object changes: null run)"; ZEN5=""; ROUNDS=${ROUNDS:-6};;
*) echo "dbk422-zen4: AB=tip at BITDEPTH 8 or 10, AB=icl at 8 (got AB=$AB BITDEPTH=$BITDEPTH)" >&2; exit 1;;
esac
JOB=dbk422-zen4-$AB-${BITDEPTH}b
TITLE="8-bit deblock_h_chroma_422 on Zen 4 ($BITDEPTH-bit build): AB=$AB"
BRANCHES="wip/x264-422-deblock"
PERIOD=${PERIOD:-50021}   # small kernels: denser samples for the liveness asserts
if [ $BITDEPTH = 8 ]; then
    DEF_CLIPLIST="field-frame-mix-i-422"
    DEF_NULLCELLS="tile-chaos-p:lowlat"
    MD5CLIPS=${MD5CLIPS:-"fades-p tile-chaos-p pan-fast-p fades-i field-frame-mix-i credits-i"}
    EXTRA_MD5=${EXTRA_MD5:-"tile-chaos-p-422:lowlat tile-chaos-p-422:normal"}
    LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i-422:normal field-frame-mix-i-422:lowlat"}
    LIVE_SHOW='deblock'
    if [ $AB = tip ]; then
        LIVE_ASSERT=${LIVE_ASSERT:-'A+:deblock_h_chroma_422(_intra)?_avx2 B0:deblock_h_chroma_422(_intra)?_avx2 B+:deblock_h_chroma_422(_intra)?_avx($|[.]) A0:deblock_h_chroma_422(_intra)?_avx($|[.])'}
    else
        LIVE_ASSERT=${LIVE_ASSERT:-'A+:deblock_h_chroma_422(_intra)?_avx512icl B0:deblock_h_chroma_422(_intra)?_avx512icl B+:deblock_h_chroma_422(_intra)?_avx2 A0:deblock_h_chroma_422(_intra)?_avx2'}
    fi
    NULL_ASSERT=${NULL_ASSERT:-'A0:deblock_h_chroma_422 B0:deblock_h_chroma_422'}
else
    DEF_CLIPLIST="field-frame-mix-i-422p10"
    DEF_NULLCELLS="field-frame-mix-i-422p10:lowlat field-frame-mix-i-422p10:normal"   # all null: no decision cell
    DEF_MD5X=""
    MD5CLIPS=${MD5CLIPS:-"tile-chaos-p-422p10 field-frame-mix-i-422p10"}
    LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i-422p10:normal"}
    LIVE_SHOW='deblock_h_chroma_422'     # prints only: the same 10-bit kernels in both arms
fi
patch_arm() {
    [ $AB = icl ] || return 0
    pl common/deblock.c 's|^(            /\* undispatched \(checkasm tests them at this level\): x264_deblock_h_chroma_422_avx512icl,\n)|            pf->deblock_h_chroma_422 = x264_deblock_h_chroma_422_avx512icl;\n            pf->deblock_h_chroma_422_intra = x264_deblock_h_chroma_422_intra_avx512icl;\n${1}|m' &&
    want common/deblock.c 'pf->deblock_h_chroma_422 = x264_deblock_h_chroma_422_avx512icl;' 1 &&
    want common/deblock.c 'pf->deblock_h_chroma_422_intra = x264_deblock_h_chroma_422_intra_avx512icl;' 1 &&
    before common/deblock.c 'if( cpu&X264_CPU_AVX512ICL )' 'pf->deblock_h_chroma_422 = x264_deblock_h_chroma_422_avx512icl;' &&
    before common/deblock.c '/* deblock_strength 1.042x, deblock_luma_mbaff 1.042x */' 'pf->deblock_h_chroma_422 = x264_deblock_h_chroma_422_avx512icl;'   # the 8-bit (#else) half
}
