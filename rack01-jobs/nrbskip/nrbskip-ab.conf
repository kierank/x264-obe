# rack01 job nrbskip-ab: wip/x264-nw-nrbskip cb5b86c2 (phase 1: non-reference B frames store no full-frame
# recon and no fdec mv/ref; phase 2: the thread's per-MB arrays in an MB-row ring, every frame) vs 4e292d6a.
# --dump-yuv turns phase 1 off (the recon of a non-ref B is only stored for dump/psnr/ssim), so the real gate is
# the NO-DUMP bitstream md5 across all 4 arms (NODUMP_GATE=1: git-archive trees share one version string).
# The recon md5 cells still gate phase 2. Extra md5 cells: frame/sliced threads, slices, slice-max-size, pyramid,
# --psnr, CAVLC (30-120 frames). Core 3 Job Y ran the full cell list (core3-jobs/nrbskip/nrbskip-ab.sh).
# Liveness: no new hot symbol; the instructions:u column is the witness (fewer stores in the arm).
# Traffic: job nrbskip-mbm (needs Kieran root). obed note: pic_out.img is undefined for X264_TYPE_B.
# Verdict decides: merge nrbskip (both phases) or phase 1 only (P2OFF = cb5b86c2~1).
JOB=nrbskip-ab
TITLE="nrbskip: no recon / mv store for non-ref B + per-MB arrays in a row ring"
BRANCHES="speed-next wip/x264-nw-nrbskip"
BASE=4e292d6ac921cde88c587352e1833137ee074ec7
ARM=cb5b86c2d53b58b6778907b2925a4c6154119477
ARMDESC="cb5b86c2 (phase 1 + phase 2)"
NODUMP_GATE=1
# no CAVLC / slice-max-size cells: both are configure-off in x264-obe (an encode would fail)
EXTRA_MD5="tile-chaos-p:normal_t4 field-frame-mix-i:normal_t4 tile-chaos-p:normal_sliced4 field-frame-mix-i:normal_slices4 tile-chaos-p:normal_pyrnone field-frame-mix-i:normal_pyrstrict tile-chaos-p:normal_psnr field-frame-mix-i:lowlat_t4"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:normal"}
LIVE_SHOW='macroblock_(ring|store|cache_save|deblock)|memcpy|memset'
LIVE_ASSERT=${LIVE_ASSERT:-}
pkg_mode() { # mode bitrate
    local nm; nm=$(nmopts $2)
    case $1 in
    normal_t4)        echo "$nm --threads 4 --frames 120 --qp 23";;
    normal_sliced4)   echo "$nm --threads 4 --sliced-threads --frames 120 --qp 23";;
    normal_slices4)   echo "$nm --slices 4 --frames 120";;
    normal_pyrnone)   echo "$nm --b-pyramid none --frames 120";;
    normal_pyrstrict) echo "$nm --b-pyramid strict --frames 120";;
    normal_psnr)      echo "$nm --psnr --frames 120";;
    lowlat_t4)        echo "$(llopts $2) --threads 4 --frames 120 --qp 23";;
    *) return 1;;
    esac
}
