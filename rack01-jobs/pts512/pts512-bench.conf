# rack01 job pts512-bench (gate for pts512-hex / pts512-dia): checkasm --bench of the AVX-512 point-set family
# (sq_min / dia_min / hex_min / oct_min / ring_min / dia_search / hex_search 8x8) against avx2, 3 seeds, in the
# hex arm tree 3956bfc2 (every kernel is assembled there). Same rows as scratchpad pts512/rack01-pts512.sh bench.
# Verdict decides: whether the in-situ hex / dia jobs are worth their rack01 time (icl rows faster than avx2).
JOB=pts512-bench
TITLE="pts512: checkasm bench of the avx512icl point sets"
BRANCHES="wip/x264-me2-pts512"
BASE=3956bfc2aabcd231f275bca6a2a84e5a2c5d7468
ARM=3956bfc2aabcd231f275bca6a2a84e5a2c5d7468
ARMDESC="3956bfc2 (bench only)"
BUILD_TREES="arm"
DEF_MD5X=""
BENCH="sad_"
BENCH_GREP='^(nop|sad_(sq_min|sq_min_mepat|dia_min|hex_min|oct_min|ring_min|dia_zmm_min|dia_search|hex_search)_)|FAIL'
ALLSTEPS=${ALLSTEPS:-"preflight build bench clean"}
