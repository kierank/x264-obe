# rack01 job hp10-zen4 (URGENT under Kieran's 11-19 x265-first rule: merged code that Zen 4 runs unjudged):
# speed-next 1c249257 (R's hpel / pad passes at 10-bit, merged 11-19) vs b3490174 (speed-next before it).
# At 10-bit Zen 4 now runs the avx2 hpel_filter copy / copy_vc / dual / _pad kernels, expand_border_sides avx2 and
# frame_init_lowres_core_pad_avx512icl (an AVX-512 kernel). Intel (Xeon E, 120 f): 4:2:2 1080i lowlat -0.63 %,
# normal -0.33 %. .44 G18: bit-exact.
# 10-bit 4:2:2 clips are generated with stressgen (native 10-bit 4:2:2, GENFRAMES), as in 10b-cabac.
# Interlaced cells decide (adaptive MBAFF takes the dual / copy_vc path); progressive cells get only the pads.
# Verdict decides: the merge stands on Zen 4, or an AVX512-block override (back to the plain 10-bit hpel / lowres).
# ZEN5 RULE: if frame_init_lowres_core_pad_avx512icl is the losing part, park it on zen5/x264-10b-lowres-pad-icl.
JOB=hp10-zen4
ZEN5="zen5/x264-10b-lowres-pad-icl = 1c249257 (if the icl lowres pad loses; override it in the AVX512ICL block)"
TITLE="10-bit hpel / pad passes (R at 10-bit) on Zen 4"
BRANCHES="speed-next wip/x264-sn-int-1119b"
BASE=b3490174ba38da0ba7af4534a45c162ead1c3c68
ARM=1c2492571a5035ac006880964948163cd32caeda
ARMDESC="1c249257 (10-bit hpel_filter dual / copy_vc / _pad, lowres pad, expand_border_sides)"
BITDEPTH=10
DEF_CLIPLIST="fades-i-422p10 field-frame-mix-i-422p10 tile-chaos-p-422p10 fades-p-422p10"
DEF_MD5X=""
DEF_MODES="lowlat normal"
