# rack01 job trprep-icl: wip/x264-nw-trprep 2534f770 (CABAC trellis prep / post kernels dispatched at AVX2; Zen 4
# runs the avx2 ones) vs the same with the undispatched avx512icl prep 4x4x4 / 8x8 and post 4x4x4 (+ac) kernels
# dispatched in the 8-bit AVX512ICL zigzag block (the branch's icl-dispatch.patch, as perl + asserts).
# Null control: lowlat (trellis 0: never reached).
# Verdict decides: dispatch the icl trellis prep/post on Zen 4/5 or keep avx2.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-trprep-icl = 2534f770 + this job's patch_arm, committed as "zen5: dispatch quant_4x4x4_scan_trellis / quant_8x8_scan_trellis / dequant_4x4x4_scan(_ac) avx512icl"
JOB=trprep-icl
ZEN5="zen5/x264-trprep-icl = 2534f770 + this job's patch_arm, committed as \"zen5: dispatch quant_4x4x4_scan_trellis / quant_8x8_scan_trellis / dequant_4x4x4_scan(_ac) avx512icl\""
TITLE="trellis prep/post scan kernels: avx512icl vs avx2"
BRANCHES="wip/x264-nw-trprep"
BASE=2534f770880f5214a8dada28c37ef79452918182
ARM=2534f770880f5214a8dada28c37ef79452918182
ARMDESC="2534f770 with quant_4x4x4_scan_trellis / quant_8x8_scan_trellis / dequant_4x4x4_scan(_ac) = *_avx512icl"
DEF_MODES="normal"
DEF_NULLCELLS="tile-chaos-p:lowlat field-frame-mix-i:lowlat"   # md5 still covers every clip x lowlat normal
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:normal"}
LIVE_SHOW='scan_trellis|dequant_4x4x4_scan|trellis'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:scan_trellis_(frame|field)_avx512icl B0:scan_trellis_(frame|field)_avx512icl B+:scan_trellis_(frame|field)_avx2 A0:scan_trellis_(frame|field)_avx2'}
NULL_ASSERT=${NULL_ASSERT:-'A0:scan_trellis B0:scan_trellis'}
patch_arm() { # the anchor is the 8-bit (#else of HIGH_BIT_DEPTH) icl quant_8x8_scan line, unique in the file
    want common/dct.c 'pf_progressive->quant_8x8_scan = b_cqm_flat ? x264_quant_8x8_scan_frame_flat_avx512icl : x264_quant_8x8_scan_frame_avx512icl;' 1 &&
    pl common/dct.c 's|(        pf_progressive->quant_8x8_scan = b_cqm_flat \? x264_quant_8x8_scan_frame_flat_avx512icl : x264_quant_8x8_scan_frame_avx512icl;\n)|$1        pf_interlaced->quant_4x4x4_scan_trellis  = x264_quant_4x4x4_scan_trellis_field_avx512icl;\n        pf_progressive->quant_4x4x4_scan_trellis = x264_quant_4x4x4_scan_trellis_frame_avx512icl;\n        pf_interlaced->quant_8x8_scan_trellis    = x264_quant_8x8_scan_trellis_field_avx512icl;\n        pf_progressive->quant_8x8_scan_trellis   = x264_quant_8x8_scan_trellis_frame_avx512icl;\n        pf_interlaced->dequant_4x4x4_scan        = x264_dequant_4x4x4_scan_field_avx512icl;\n        pf_progressive->dequant_4x4x4_scan       = x264_dequant_4x4x4_scan_frame_avx512icl;\n        pf_interlaced->dequant_4x4x4_scan_ac     = x264_dequant_4x4x4_scan_field_ac_avx512icl;\n        pf_progressive->dequant_4x4x4_scan_ac    = x264_dequant_4x4x4_scan_frame_ac_avx512icl;\n|' &&
    want common/dct.c 'pf_progressive->quant_4x4x4_scan_trellis = x264_quant_4x4x4_scan_trellis_frame_avx512icl;' 1
}
