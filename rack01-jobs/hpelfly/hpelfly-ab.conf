# rack01 job hpelfly-ab: wip/x264-nw-hpelfly, subpel samples interpolated on the fly in per-reference row bands
# (no stored H/V/C planes) + the band-pointer swap for the fused search, vs the stored planes.
# base = 14953cf5 (consumers, HPEL_FLY default 0), arm = tip 401d882f (33d409a1 swap + default on at 8-bit).
# Bit-exact by design: recon md5 across arms in every cell, plus the C-consumer cells (threads 4, subme 1,
# chroma ME, slower) at 30-120 frames. Liveness: the arm runs hpel_fly_* and fewer hpel_filter samples.
# The L3<->DRAM traffic is job hpelfly-mbm (needs Kieran root).
# Verdict decides: merge hpelfly (8-bit default on) or keep it off; cycles here, bytes in hpelfly-mbm.
JOB=hpelfly-ab
TITLE="hpelfly: on-the-fly subpel bands vs stored H/V/C planes (8-bit)"
BRANCHES="wip/x264-nw-hpelfly"
BASE=14953cf5645cf0e83c9360b0c9d4b2dd0978cf92   # HPEL_FLY 0: stored planes
ARM=401d882f8996231bfdb505428a3ca594eb7d2aaf    # tip: HPEL_FLY 1 at 8-bit, with the band swap
ARMDESC="401d882f (hpelfly on, band swap)"
EXTRA_MD5="tile-chaos-p:normal_t4 field-frame-mix-i:normal_t4 field-frame-mix-i:lowlat_t4 tile-chaos-p:sub1 field-frame-mix-i:sub1 tile-chaos-p:chme field-frame-mix-i:chme tile-chaos-p:slower field-frame-mix-i:slower"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='hpel|fly|me_search'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:hpel_fly|fly_band B0:hpel_fly|fly_band A<B:hpel_filter'}
pkg_mode() { # mode bitrate
    case $1 in
    normal_t4) echo "$(nmopts $2) --threads 4 --frames 120";;
    lowlat_t4) echo "$(llopts $2) --threads 4 --frames 120";;
    sub1)      echo "--preset superfast --subme 1 --bframes 2 --vbv-bufsize $2 --frames 120";;
    chme)      echo "--chroma-me --subme 7 --vbv-bufsize $2 --frames 60";;
    slower)    echo "--preset slower --bframes 3 --b-adapt 1 --vbv-bufsize $2 --frames 30";;
    *) return 1;;
    esac
}
