# rack01 job hpelfly-ab: wip/x264-nw-hpelfly, subpel samples interpolated on the fly in per-reference row bands
# (no stored H/V/C planes) + the band-pointer swap for the fused search, vs the stored planes.
# base = e8bb50a5 (consumers, band swap, the B BI-cost stride fix; HPEL_FLY default 0), arm = tip e40733b2
# (default on at 8-bit). History rewritten 11-12: 401d882f's P6 normal md5 FAIL was the B BI cost reading
# list 1's planes at list 0's stride (band vs window), fixed by e8bb50a5 before the default-on commit.
# Bit-exact by design: recon md5 across arms in every cell, plus the C-consumer cells (threads 4 without VBV,
# subme 1, chroma ME, slower) and the weighted-ref cells (weightp 2 dups, ref 3, interlaced weighted).
# Liveness: the arm runs hpel_fly_* and fewer hpel_filter samples. The L3<->DRAM traffic is job hpelfly-mbm.
# Verdict decides: merge hpelfly (8-bit default on) or keep it off; cycles here, bytes in hpelfly-mbm.
JOB=hpelfly-ab
TITLE="hpelfly: on-the-fly subpel bands vs stored H/V/C planes (8-bit)"
BRANCHES="wip/x264-nw-hpelfly"
BASE=e8bb50a574c986a0eec6cdb1ac139513fecd9d53   # HPEL_FLY 0: stored planes
ARM=e40733b2e5dc4121798cef3fec57c54baf7d479f    # tip: HPEL_FLY 1 at 8-bit, with the band swap
ARMDESC="e40733b2 (hpelfly on, band swap, BI stride fix)"
EXTRA_MD5="tile-chaos-p:normal_t4 field-frame-mix-i:normal_t4 field-frame-mix-i:lowlat_t4 tile-chaos-p:sub1 field-frame-mix-i:sub1
           tile-chaos-p:chme field-frame-mix-i:chme tile-chaos-p:slower field-frame-mix-i:slower
           fades-p:normal_wp2 fades-i:normal_wp2 fades-p:medium_wp2r3 tile-chaos-p:medium_wp2r3 fades-i:medium_wp2r3
           field-frame-mix-i:medium_wp2r3 fades-i-422:medium_wp2r3"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='hpel|fly|me_search'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:hpel_fly|fly_band B0:hpel_fly|fly_band A<B:hpel_filter'}
pkg_mode() { # mode bitrate
    case $1 in
    # threads 4 without VBV (crf; nal-hrd drops with a warning): threaded VBV is not deterministic run to run
    normal_t4) echo "$(nmopts $2) --threads 4 --frames 120 --crf 23 --vbv-maxrate 0 --vbv-bufsize 0";;
    lowlat_t4) echo "$(llopts $2) --threads 4 --frames 120 --crf 23 --vbv-maxrate 0 --vbv-bufsize 0";;
    sub1)      echo "--preset superfast --subme 1 --bframes 2 --vbv-bufsize $2 --frames 120";;
    # chroma ME is the default (x264-obe has no --chroma-me): the normal line without --no-chroma-me, subme 7
    chme)      echo "$(nmopts $2 | sed 's/ --no-chroma-me//') --subme 7 --frames 60";;
    slower)    echo "--preset slower --bframes 3 --b-adapt 1 --vbv-bufsize $2 --frames 30";;
    # weighted refs: weightp 2 (smart: the unweighted and offset - 1 duplicates of ref 0), 3 refs, B frames
    normal_wp2)   echo "$(nmopts $2) --weightp 2 --frames 60";;
    medium_wp2r3) echo "--ref 3 --weightp 2 --bframes 3 --rc-lookahead 24 --vbv-bufsize $2 --frames 60";;
    *) return 1;;
    esac
}
