# rack01 job mvpredc-zen4: wip/x264-mvpred-c, a C-only restructure of x264_mb_predict_mv_ref16x16 (Zen 4 runs it
# too: no asm). Arm pairs of xeone-jobs/mvpredc/mvpredc-ab.sh on test/x264-mvpred-c-twin (AB):
#   AB=all  base 44754802 (speed-next) -> arm c234b4b1 (the tip)
#   AB=c1   base 44754802 -> arm 970be01c (the frame's temporal scales: x264_mvpred_ref16x16_init in slice_init)
#   AB=c2   base 970be01c -> arm c234b4b1 (MBAFF only: per-mb neighbour shifts and collocated mvs, mvref_mb_init)
# Decision cells: the interlaced ones (MBAFF, 4-6 calls per mb): fades-i field-frame-mix-i credits-i and 8-bit 4:2:2
# field-frame-mix-i-422, lowlat + normal. ref16x16 runs in every P/B mb, so there is no zero-call cell; for AB=c2 the
# progressive cells tile-chaos-p / pan-fast-p normal are the near-null control (one dropped b_tconv test per call,
# zero mvref_mb_init calls). For AB=all / c1 the progressive cells are md5 cells (every clip x lowlat normal);
# CLIPLIST="fades-p tile-chaos-p pan-fast-p" times them on request.
# TWIN GATE (step twin, before live / md5 / timing): test/x264-mvpred-c-twin a2abd958 runs speed-next 44754802's
# x264_mb_predict_mv_ref16x16 beside c234b4b1's on every call (the new result is used), aborts on any count / mvc
# difference and prints "mvpred-twin 8-bit: calls C tmvp T mbaff M mismatches 0" at exit. Every md5 cell plus frame
# threads (--threads 2), sliced threads (--threads 2 --sliced-threads) and medium --direct temporal --weightp 2
# --ref 3 on tile-chaos-p / field-frame-mix-i / field-frame-mix-i-422 must exit 0 with "mismatches 0" (and mbaff > 0
# on the -i cells). AB=c1 also runs test/x264-mvpred-c-twin1 9f158ea7 (the old one beside 970be01c's).
# BITDEPTH=10 (optional: mvpred.c is shared C): the -422p10 interlaced clips decide, tile-chaos-p-422p10 is md5 only.
# Verdict decides: merge wip/x264-mvpred-c (both commits, or c1 alone if c2 loses on the interlaced cells).
# Not AVX-512 (C only): no zen5 branch.
AB=${AB:-all}
BITDEPTH=${BITDEPTH:-8}
case $BITDEPTH in 8|10) ;; *) echo "mvpredc-zen4: BITDEPTH must be 8 or 10" >&2; exit 1;; esac
SN=447548023b44aaa279efc5dca85344ac220f34ce     # speed-next
C1=970be01c2d4bae21797f83d2eb6076639aca4f65
C2=c234b4b152281ca6d6503b7863d0fb8cd0d246bf     # wip/x264-mvpred-c tip
TWINS="a2abd9584603ee4cc4042e53a26cb508b3095e33"   # test/x264-mvpred-c-twin~1: old beside c234b4b1
case $AB in
all) BASE=$SN; ARM=$C2; ARMDESC="c234b4b1 (c1 + c2: per-frame temporal scales, MBAFF per-mb values)";;
c1)  BASE=$SN; ARM=$C1; ARMDESC="970be01c (per-frame temporal scales)"
     TWINS="$TWINS 9f158ea78a9e8ee0e4db51c640474b6e490dd7da";;   # test/x264-mvpred-c-twin1: old beside 970be01c
c2)  BASE=$C1; ARM=$C2; ARMDESC="c234b4b1 (MBAFF per-mb values, mvref_mb_init) on 970be01c";;
*) echo "mvpredc-zen4: unknown AB $AB (all c1 c2)" >&2; exit 1;;
esac
JOB=mvpredc-zen4-$AB-${BITDEPTH}b
TITLE="mvpred-c: x264_mb_predict_mv_ref16x16 in C ($BITDEPTH-bit): AB=$AB"
BRANCHES="speed-next wip/x264-mvpred-c test/x264-mvpred-c-twin test/x264-mvpred-c-twin1"
ALLSTEPS=${ALLSTEPS:-"preflight build check twin live md5 time report clean"}
if [ $BITDEPTH = 8 ]; then
    DEF_CLIPLIST="fades-i field-frame-mix-i credits-i field-frame-mix-i-422"
    MD5CLIPS=${MD5CLIPS:-"fades-p tile-chaos-p pan-fast-p fades-i field-frame-mix-i credits-i"}
    TWINCLIPS="tile-chaos-p field-frame-mix-i field-frame-mix-i-422"
    [ $AB = c2 ] && DEF_NULLCELLS="tile-chaos-p:normal pan-fast-p:normal"
    LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i:normal field-frame-mix-i:lowlat"}
else
    DEF_CLIPLIST="fades-i-422p10 field-frame-mix-i-422p10"
    DEF_MD5X=""
    MD5CLIPS=${MD5CLIPS:-"tile-chaos-p-422p10 fades-i-422p10 field-frame-mix-i-422p10"}
    TWINCLIPS="tile-chaos-p-422p10 field-frame-mix-i-422p10"
    [ $AB = c2 ] && DEF_NULLCELLS="tile-chaos-p-422p10:normal"
    LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i-422p10:normal field-frame-mix-i-422p10:lowlat"}
fi
LIVE_SHOW='predict_mv|mvref|mvpred'
case $AB in   # mvpred_ref16x16_init runs once per slice: info only (no sample count assert)
all) LIVE_ASSERT=${LIVE_ASSERT:-'A+:mb_predict_mv_ref16x16 B+:mb_predict_mv_ref16x16 A+:mvref_mb_init B0:mvref_mb_init B0:mvpred_ref16x16_init info:mvpred_ref16x16_init'};;
c1)  LIVE_ASSERT=${LIVE_ASSERT:-'A+:mb_predict_mv_ref16x16 B+:mb_predict_mv_ref16x16 A0:mvref_mb_init B0:mvref_mb_init B0:mvpred_ref16x16_init info:mvpred_ref16x16_init'};;
c2)  LIVE_ASSERT=${LIVE_ASSERT:-'A+:mb_predict_mv_ref16x16 B+:mb_predict_mv_ref16x16 A+:mvref_mb_init B0:mvref_mb_init'}
     NULL_ASSERT=${NULL_ASSERT:-'A0:mvref_mb_init B0:mvref_mb_init'};;
esac
pkg_mode() { # mode bitrate: the twin gate's extra cells
    case $1 in
    normal_ft) echo "$(nmopts $2) --threads 2 --qp 23";;
    normal_st) echo "$(nmopts $2) --threads 2 --sliced-threads --qp 23";;
    medium_td) echo "--preset medium --direct temporal --weightp 2 --ref 3 --vbv-bufsize $2";;
    *) return 1;;
    esac
}
twincells() { cells_md5; for c in $TWINCLIPS; do for m in normal_ft normal_st medium_td; do echo $c:$m; done; done; }
pkgstep_twin() { # the exactness gate: every twin tree, every twin cell: rc 0, "mismatches 0", mbaff > 0 on -i cells
    mkdir -p $W/out; fetchsrc; genclips; local rc=0 n=0 s x c m l e
    for s in $TWINS; do git -C $SRC cat-file -e "$s^{commit}" 2> /dev/null || die "twin $s is not in $SRC"; done
    for s in $TWINS; do n=$((n + 1))
        tree twin$n $s :
        for x in $(twincells | awk '!s[$0]++'); do c=${x%%:*}; m=${x#*:}
            enc twin$n $c $m tw > /dev/null; e=$?
            l=$(grep -h 'mvpred-twin' $W/out/tw.log | tr '\n' ' ')
            v=PASS
            [ $e = 0 ] && grep -q 'mismatches 0$' $W/out/tw.log && ! grep -q 'MISMATCH\|out of the tscale range' $W/out/tw.log || v=FAIL
            case $c in *-i|*-i-*) echo "$l" | grep -q ' mbaff [1-9]' || v=FAIL;; esac
            [ $v = PASS ] || rc=1
            echo "$v twin$n ${s:0:8} $x (rc $e): $l"
        done
        rm -rf $W/twin$n
    done
    [ $rc = 0 ] && echo "TWIN GATE PASS" || { echo "TWIN GATE FAIL: no timing"; return 1; }
}
