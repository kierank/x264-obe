# rack01 job idct8-zen4p16: the Zen 4 prune of add16x16_idct8 (avx2/icl 0.83-0.90 on laptop Zen 5, 0.91 rack01
# checkasm). wip/x264-gap-idct8 tip 76dda80b (with the batching caller) vs the same with the 8-bit AVX512ICL
# add16x16_idct8 line deleted (Zen 4 runs add16x16_idct8_avx2). Only meaningful with batching: run after idct8-batch.
# Null control: --no-8x8dct.
# Verdict decides: prune add16x16_idct8 avx512icl on Zen 4 (comment it into the zen4 prune list) or keep it.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   PRUNE job (the arm drops avx512icl): if the prune WINS, zen5/x264-idct8-add16x16-icl = 76dda80b (the base, icl dispatched); if it loses or ties, icl stays dispatched and nothing is parked
JOB=idct8-zen4p16
ZEN5="PRUNE job (the arm drops avx512icl): if the prune WINS, zen5/x264-idct8-add16x16-icl = 76dda80b (the base, icl dispatched); if it loses or ties, icl stays dispatched and nothing is parked"
TITLE="add16x16_idct8 on Zen 4: avx2 (pruned icl) vs avx512icl"
BRANCHES="wip/x264-gap-idct8"
BASE=76dda80bd00f17eb80a913c7d440eed2db3b2b5e
ARM=76dda80bd00f17eb80a913c7d440eed2db3b2b5e
ARMDESC="76dda80b without the 8-bit AVX512ICL add16x16_idct8 line"
DEF_NULLCELLS="tile-chaos-p:normal_no8x8dct field-frame-mix-i:normal_no8x8dct"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='idct8'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:add16x16_idct8_avx2 B0:add16x16_idct8_avx2 B+:add16x16_idct8_avx512icl A0:add16x16_idct8_avx512icl'}
NULL_ASSERT=${NULL_ASSERT:-'A0:idct8 B0:idct8'}
patch_arm() {
    pl common/dct.c 's/^        dctf->add16x16_idct8   = x264_add16x16_idct8_avx512icl;\n//m' &&
    want common/dct.c 'dctf->add16x16_idct8   = x264_add16x16_idct8_avx512icl;' 0 &&
    want common/dct.c 'dctf->add16x16_idct8  = x264_add16x16_idct8_avx512icl;' 1
}
