# rack01 job idct8-zen4icl: idct8-zen4 with ZFN=avx512icl (add8x8_idct8_avx512icl, the EVEX pairs kernel dc5ad584,
# undispatched in speed-next d625b235) vs avx. Null control: --no-8x8dct.
# Verdict decides: the Zen 4/5 add8x8_idct8 pointer (with idct8-zen4).
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-idct8-add8x8-icl = d625b235 + this job's patch_arm, committed as "zen5: dispatch add8x8_idct8_avx512icl"
JOB=idct8-zen4icl
ZEN5="zen5/x264-idct8-add8x8-icl = d625b235 + this job's patch_arm, committed as \"zen5: dispatch add8x8_idct8_avx512icl\""
ZFN=avx512icl
TITLE="add8x8_idct8 on Zen 4: avx512icl vs avx"
BRANCHES="speed-next"
BASE=d625b23529d635a28455cd2a2d861b667d1a7bad
ARM=d625b23529d635a28455cd2a2d861b667d1a7bad
ARMDESC="d625b235 with the AVX512ICL add8x8_idct8 = x264_add8x8_idct8_avx512icl"
DEF_NULLCELLS="tile-chaos-p:normal_no8x8dct field-frame-mix-i:normal_no8x8dct"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='idct8'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:add8x8_idct8_avx512icl B0:add8x8_idct8_avx512icl B+:add8x8_idct8_avx($|[.]) A0:add8x8_idct8_avx($|[.])'}
NULL_ASSERT=${NULL_ASSERT:-'A0:idct8 B0:idct8'}
patch_arm() {
    pl common/dct.c 's/(in situ \*\/\n        dctf->add8x8_idct8     = x264_add8x8_idct8_)avx;/${1}avx512icl;/' &&
    want common/dct.c 'dctf->add8x8_idct8     = x264_add8x8_idct8_avx512icl;' 1 &&
    want common/dct.c 'dctf->add8x8_idct8     = x264_add8x8_idct8_avx;' 1
}
