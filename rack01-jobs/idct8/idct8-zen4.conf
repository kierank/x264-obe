# rack01 job idct8-zen4: add8x8_idct8 on Zen 4. speed-next d625b235 (the AVX512ICL block keeps add8x8_idct8_avx)
# vs the same with that one line switched to avx2 (cd484ea4's kernel, dispatched on Intel AVX2 by f054cac3).
# The avx512icl variant is job idct8-zen4icl. The old idct8-ab.sh sed replaced BOTH identical
# "= x264_add8x8_idct8_avx;" lines (the AVX block too); this patch anchors on the ICL block's comment.
# Null control: --no-8x8dct.
# Verdict decides: the Zen 4/5 add8x8_idct8 pointer (avx stays, or avx2 / avx512icl).
JOB=idct8-zen4
TITLE="add8x8_idct8 on Zen 4: avx2 vs avx"
BRANCHES="speed-next"
BASE=d625b23529d635a28455cd2a2d861b667d1a7bad
ARM=d625b23529d635a28455cd2a2d861b667d1a7bad
ARMDESC="d625b235 with the AVX512ICL add8x8_idct8 = x264_add8x8_idct8_avx2"
DEF_NULLCELLS="tile-chaos-p:normal_no8x8dct field-frame-mix-i:normal_no8x8dct"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='idct8'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:add8x8_idct8_avx2 B0:add8x8_idct8_avx2 B+:add8x8_idct8_avx($|[.]) A0:add8x8_idct8_avx($|[.])'}
NULL_ASSERT=${NULL_ASSERT:-'A0:idct8 B0:idct8'}
patch_arm() {
    pl common/dct.c 's/(in situ \*\/\n        dctf->add8x8_idct8     = x264_add8x8_idct8_)avx;/${1}avx2;/' &&
    want common/dct.c 'dctf->add8x8_idct8     = x264_add8x8_idct8_avx2;' 2 &&   # the AVX2 block's line + this one
    want common/dct.c 'dctf->add8x8_idct8     = x264_add8x8_idct8_avx;' 1
}
