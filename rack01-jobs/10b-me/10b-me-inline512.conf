# rack01 job 10b-me-inline512: 10-bit 4:2:2, me_search_fpel_inline_avx512 (the inline rewrite, dfd3f236) vs the
# dispatched old 10-bit avx512 ME_SEARCH_FPEL entry (calls kernels through the C ABI, slower than C per the
# package report). wip/x264-10b-me 41f6b02e (tools: wip/x264-10b-me-tools a2f9181f, .44 script dot44.sh).
# Arm patch = the package report's sed (first me_search_fpel_avx512 = the HIGH_BIT_DEPTH block), as perl + asserts.
# rack01 has no 10-bit 4:2:2 content: the clips are generated with stressgen (native 10-bit 4:2:2, GENFRAMES).
# Null control: --me dia (the fused search makes zero calls).
# Verdict decides: dispatch the inline avx512 entry at 10-bit on AVX512 (a one-line commit) or keep the old one.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-10b-me-inline512 = 41f6b02e + this job's patch_arm, committed as "zen5: dispatch me_search_fpel_inline_avx512 (10-bit)"
JOB=10b-me-inline512
ZEN5="zen5/x264-10b-me-inline512 = 41f6b02e + this job's patch_arm, committed as \"zen5: dispatch me_search_fpel_inline_avx512 (10-bit)\""
TITLE="10-bit 4:2:2 ME: inline avx512 fused fpel search vs the old 10-bit avx512 entry"
BRANCHES="wip/x264-10b-me"
BASE=41f6b02e8291c837f47b31f5348bea80db6da3aa   # tip: AVX512 -> x264_10_me_search_fpel_avx512 (old)
ARM=41f6b02e8291c837f47b31f5348bea80db6da3aa    # tip + the 10-bit AVX512 pointer -> me_search_fpel_inline_avx512
ARMDESC="tip with the 10-bit AVX512 me_search_fpel pointer switched to x264_me_search_fpel_inline_avx512"
BITDEPTH=10
DEF_CLIPLIST="fades-p-422p10 tile-chaos-p-422p10 fades-i-422p10 field-frame-mix-i-422p10"
DEF_MD5X=""
DEF_NULLCELLS="field-frame-mix-i-422p10:lowlat_dia tile-chaos-p-422p10:lowlat_dia"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p-422p10:normal field-frame-mix-i-422p10:lowlat"}
LIVE_SHOW='me_search|refine_subpel'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:me_search_fpel_inline_avx512 B0:me_search_fpel_inline B+:me_search_fpel_avx512$ A0:me_search_fpel_avx512$'}
NULL_ASSERT=${NULL_ASSERT:-'A0:me_search_fpel B0:me_search_fpel'}
patch_arm() {
    pl common/pixel.c 's/x264_me_search_fpel_avx512;/x264_me_search_fpel_inline_avx512;/' &&
    want common/pixel.c 'pixf->me_search_fpel = x264_me_search_fpel_inline_avx512;' 1 &&
    want common/pixel.c 'pixf->me_search_fpel = x264_me_search_fpel_avx512;' 1 &&
    before common/pixel.c 'x264_me_search_fpel_inline_avx512;' '#else // !HIGH_BIT_DEPTH'
}
