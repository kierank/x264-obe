# rack01 job avg2w16-zen4: wip/x264-gap-avg2w16 6454133a. The Intel AVX2 block (get_ref in asm with the avg2 loops
# inline = get_ref_noweight_avx2, mc_luma_avx2_intel, VEX avg2 table) switched on for AVX-512 too (perl, asserted)
# vs the tip as dispatched (Zen 4: get_ref_avx2 C wrapper, mc_luma_sse2). The asm get_ref is ISA-neutral (saves the
# call overhead), so it may win on Zen 4 although d531ace0's VEX w16 alone lost 1.03-1.11x here. No null control.
# Verdict decides: drop the !(cpu&X264_CPU_AVX512) guard (Zen 4 takes the Intel block) or keep Zen 4 unchanged.
JOB=avg2w16-zen4
TITLE="get_ref / mc_luma: the Intel AVX2 block (asm get_ref) on Zen 4"
BRANCHES="wip/x264-gap-avg2w16"
BASE=6454133ade1a723d8b8abbbd2223a469d6d5a248
ARM=6454133ade1a723d8b8abbbd2223a469d6d5a248
ARMDESC="6454133a with the Intel get_ref / mc_luma block enabled on AVX-512"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='get_ref|avg2|mc_luma'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:get_ref_noweight B0:get_ref_noweight'}
patch_arm() {
    want common/x86/mc-c.c '    if( 1 )' 0 &&
    pl common/x86/mc-c.c 's/    if\( !\(cpu&X264_CPU_AVX512\) \)\n    \{\n        pf->get_ref = get_ref_avx2_intel;/    if( 1 )\n    {\n        pf->get_ref = get_ref_avx2_intel;/' &&
    want common/x86/mc-c.c '    if( 1 )' 1
}
