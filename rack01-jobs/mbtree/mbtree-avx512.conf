# rack01 job mbtree-avx512: the int32 strip mbtree_propagate_list + fused B lists (list2) in avx512, on the mbtree
# merge. base = integration b401b2e4 (AVX-512 CPUs: the old avx512 list for P rows + the avx2 list2 strip for B
# rows), arm = 608a1c9c (wip/x264-mbtree-avx512-arm: strip_asm_avx512 + list2_strip_asm_avx512 = 0b09bab8 rebased).
# Normal cells only (lowlat = zerolatency: no lookahead, no mbtree); two lowlat cells are the null control.
# Verdict decides: merge 608a1c9c after the mbtree merge, or leave the merge as is.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-mbtree-avx512 = 608a1c9c (the arm commit on the mbtree merge)
JOB=mbtree-avx512
ZEN5="zen5/x264-mbtree-avx512 = 608a1c9c (the arm commit on the mbtree merge)"
TITLE="mbtree propagate: avx512 strip + list2 vs the merge (avx512 list + avx2 list2)"
BRANCHES="wip/x264-sn-int-1113d wip/x264-mbtree-avx512-arm"
BASE=b401b2e4f940b1b5e5ea7127de6cc50383297f4e
ARM=608a1c9c3fb901b4b5b926be198e6155c7d3bf36
ARMDESC="608a1c9c (strip_asm_avx512 + list2_strip_asm_avx512)"
DEF_MODES="normal"
DEF_NULLCELLS="tile-chaos-p:lowlat field-frame-mix-i:lowlat"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:normal"}
LIVE_SHOW='mbtree'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:mbtree.*strip.*avx512 B0:mbtree.*strip.*avx512 B+:mbtree.*strip.*avx2'}
NULL_ASSERT=${NULL_ASSERT:-'A0:mbtree_propagate B0:mbtree_propagate'}
