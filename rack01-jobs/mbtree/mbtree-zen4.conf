# Normal cells only (lowlat = zerolatency: no lookahead, no mbtree); two lowlat cells are the null control.
# Verdict decides: the merge stands on Zen 4, or an AVX512-block override (list2 NULL) if Zen 4 loses.
# No AVX-512 kernel in this pair (the avx512 strip is job mbtree-avx512), so no zen5 branch from this job.
