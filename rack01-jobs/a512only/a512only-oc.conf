# rack01 job a512only-oc: 8-bit 4:2:2 (NV16 is production). optimize_chroma_2x4_dc_avx2 (95e29b4d) as a Zen 4 prune
# of the avx512icl one: wip/x264-gap-a512only 86666108 vs the same with the 8-bit AVX512ICL pointer switched to avx2.
# Timing cells are 8-bit 4:2:2 (stressgen clips, GENFRAMES); the 4:2:0 cells are the null control (no 2x4 chroma DC).
# Verdict decides: prune optimize_chroma_2x4_dc avx512icl on Zen 4 (one line in quant.c) or keep it.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   PRUNE job (the arm drops avx512icl): if the prune WINS, zen5/x264-a512only-oc-icl = 86666108 (the base, optimize_chroma_2x4_dc_avx512icl dispatched); otherwise nothing is parked
JOB=a512only-oc
ZEN5="PRUNE job (the arm drops avx512icl): if the prune WINS, zen5/x264-a512only-oc-icl = 86666108 (the base, optimize_chroma_2x4_dc_avx512icl dispatched); otherwise nothing is parked"
TITLE="optimize_chroma_2x4_dc on Zen 4 (4:2:2): avx2 vs avx512icl"
BRANCHES="wip/x264-gap-a512only"
BASE=86666108c7d181edcfda046d613d7c689f3f2438
ARM=86666108c7d181edcfda046d613d7c689f3f2438
ARMDESC="86666108 with the 8-bit AVX512ICL optimize_chroma_2x4_dc = x264_optimize_chroma_2x4_dc_avx2"
DEF_CLIPLIST="fades-p-422 tile-chaos-p-422 fades-i-422 field-frame-mix-i-422 credits-i-422"
DEF_MD5X=""
DEF_NULLCELLS="tile-chaos-p:lowlat tile-chaos-p:normal"
LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i-422:normal tile-chaos-p-422:lowlat"}
LIVE_SHOW='optimize_chroma|coeff_last'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:optimize_chroma_2x4_dc_avx2 B0:optimize_chroma_2x4_dc_avx2 B+:optimize_chroma_2x4_dc_avx512icl A0:optimize_chroma_2x4_dc_avx512icl'}
NULL_ASSERT=${NULL_ASSERT:-'A0:optimize_chroma_2x4_dc B0:optimize_chroma_2x4_dc'}
patch_arm() {
    pl common/quant.c 's/(#else \/\/ !HIGH_BIT_DEPTH.*?pf->optimize_chroma_2x4_dc = x264_optimize_chroma_2x4_dc_)avx512icl;/${1}avx2;/s' &&
    want common/quant.c 'pf->optimize_chroma_2x4_dc = x264_optimize_chroma_2x4_dc_avx2;' 2 &&
    want common/quant.c 'pf->optimize_chroma_2x4_dc = x264_optimize_chroma_2x4_dc_avx512icl;' 1 &&
    before common/quant.c 'pf->optimize_chroma_2x4_dc = x264_optimize_chroma_2x4_dc_avx512icl;' '#else // !HIGH_BIT_DEPTH'
}
