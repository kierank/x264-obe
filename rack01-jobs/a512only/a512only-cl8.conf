# rack01 job a512only-cl8: 8-bit 4:2:2. coeff_last8_avx2_lzcnt (06bb1b9a) as a Zen 4 prune of coeff_last8_avx512:
# wip/x264-gap-a512only 86666108 vs the same with the 8-bit AVX512 coeff_last8 line removed (Zen 4 falls back to
# avx2_lzcnt). Timing cells are 8-bit 4:2:2 (stressgen clips); the 4:2:0 cells are the null control.
# Verdict decides: prune coeff_last8 avx512 on Zen 4 (one line in quant.c) or keep it.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   PRUNE job (the arm drops avx512): if the prune WINS, zen5/x264-a512only-cl8-avx512 = 86666108 (the base, coeff_last8_avx512 dispatched); otherwise nothing is parked
JOB=a512only-cl8
ZEN5="PRUNE job (the arm drops avx512): if the prune WINS, zen5/x264-a512only-cl8-avx512 = 86666108 (the base, coeff_last8_avx512 dispatched); otherwise nothing is parked"
TITLE="coeff_last8 on Zen 4 (4:2:2): avx2_lzcnt vs avx512"
BRANCHES="wip/x264-gap-a512only"
BASE=86666108c7d181edcfda046d613d7c689f3f2438
ARM=86666108c7d181edcfda046d613d7c689f3f2438
ARMDESC="86666108 without the 8-bit AVX512 coeff_last8 = x264_coeff_last8_avx512 line"
DEF_CLIPLIST="fades-p-422 tile-chaos-p-422 fades-i-422 field-frame-mix-i-422 credits-i-422"
DEF_MD5X=""
DEF_NULLCELLS="tile-chaos-p:lowlat tile-chaos-p:normal"
LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i-422:normal tile-chaos-p-422:lowlat"}
LIVE_SHOW='coeff_last'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:coeff_last8_avx2 B0:coeff_last8_avx2 B+:coeff_last8_avx512 A0:coeff_last8_avx512'}
NULL_ASSERT=${NULL_ASSERT:-'A0:coeff_last8 B0:coeff_last8'}
patch_arm() {
    pl common/quant.c 's/(#else \/\/ !HIGH_BIT_DEPTH.*?)        pf->coeff_last8 = x264_coeff_last8_avx512;\n/$1/s' &&
    want common/quant.c 'pf->coeff_last8 = x264_coeff_last8_avx512;' 1 &&
    before common/quant.c 'pf->coeff_last8 = x264_coeff_last8_avx512;' '#else // !HIGH_BIT_DEPTH'
}
