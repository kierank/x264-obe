# rack01 job a512only-pcd: plane_copy_deinterleave_avx2 forced over the avx512icl pointer (the Zen 4 prune check),
# wip/x264-gap-a512only 86666108. EXPECTED ZERO-CALL like a512only-zmm (production-dead no-mvs weightp path):
# the live step should print NOT LIVE and stop the job; if it is live, md5 and timing follow.
# Verdict decides: nothing to prune in production (expected), or a real in-situ A/B.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   PRUNE job (the arm drops avx512icl): if the prune WINS, zen5/x264-a512only-pcd-icl = 86666108 (the base); NOT LIVE / loss / tie: nothing is parked
JOB=a512only-pcd
ZEN5="PRUNE job (the arm drops avx512icl): if the prune WINS, zen5/x264-a512only-pcd-icl = 86666108 (the base); NOT LIVE / loss / tie: nothing is parked"
TITLE="plane_copy_deinterleave avx2 vs avx512icl (expected zero-call in production)"
BRANCHES="wip/x264-gap-a512only"
BASE=86666108c7d181edcfda046d613d7c689f3f2438
ARM=86666108c7d181edcfda046d613d7c689f3f2438
ARMDESC="86666108 with plane_copy_deinterleave = x264_plane_copy_deinterleave_avx2 on AVX512ICL"
LIVE_CELLS=${LIVE_CELLS:-"fades-p:normal fades-i:lowlat"}
LIVE_SHOW='plane_copy_deinterleave|weight'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:plane_copy_deinterleave_avx2'}
patch_arm() {
    pl common/x86/mc-c.c 's/(        pf->plane_copy_deinterleave = x264_plane_copy_deinterleave_)avx512icl;/${1}avx2;/g' &&
    want common/x86/mc-c.c 'pf->plane_copy_deinterleave = x264_plane_copy_deinterleave_avx512icl;' 0
}
