# rack01 job intrax9-icl: wip/x264-nw-intrax9 76142791 (AVX2 x9 fdec + MB driver dispatched, 8-bit) vs the same
# with the undispatched avx512icl x9 kernels dispatched: intra_satd_x9_4x4, intra_sa8d_x9_8x8(_fdec) in the 8-bit
# AVX512ICL pixel block, the icl x9 4x4 recon (+ _notr) in dct.c. This is AB=icl of core3-jobs/intrax9/intrax9-ab.sh
# with one FIX: that script's pixel.c anchor (the first AVX512ICL block with #if ARCH_X86_64) is the HIGH_BIT_DEPTH
# block, so on an 8-bit build its arm changed nothing; here the anchor is the 8-bit block and an assert checks it.
# No null control (intra analysis runs in every cell).
# Verdict decides: dispatch the icl x9 kernels on Zen 4/5 or keep AVX2 (they were slower on laptop Zen 5).
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-intrax9-icl = 76142791 + this job's patch_arm, committed as "zen5: dispatch intra_satd_x9_4x4 / intra_sa8d_x9_8x8(_fdec) / x9_4x4_recon(_notr) avx512icl"
JOB=intrax9-icl
ZEN5="zen5/x264-intrax9-icl = 76142791 + this job's patch_arm, committed as \"zen5: dispatch intra_satd_x9_4x4 / intra_sa8d_x9_8x8(_fdec) / x9_4x4_recon(_notr) avx512icl\""
TITLE="intra x9: avx512icl x9 4x4 / 8x8 / recon vs AVX2"
BRANCHES="wip/x264-nw-intrax9"
BASE=7614279149fa2f7c6b8afd7b53db18edb3e91221
ARM=7614279149fa2f7c6b8afd7b53db18edb3e91221
ARMDESC="76142791 with the avx512icl x9 kernels dispatched (8-bit AVX512ICL blocks)"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:lowlat"}
LIVE_SHOW='x9'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:x9.*avx512icl B0:x9.*avx512icl'}
patch_arm() {
    pl common/pixel.c 's|(        /\* ymm, VBMI2 \+ opmask transform; not the X264_CPU_AVX512 zmm table below \*/\n)|$1        pixf->intra_satd_x9_4x4 = x264_intra_satd_x9_4x4_avx512icl;\n        pixf->intra_sa8d_x9_8x8 = x264_intra_sa8d_x9_8x8_avx512icl;\n        pixf->intra_sa8d_x9_8x8_fdec = x264_intra_sa8d_x9_8x8_fdec_avx512icl;\n|' &&
    want common/pixel.c 'pixf->intra_sa8d_x9_8x8_fdec = x264_intra_sa8d_x9_8x8_fdec_avx512icl;' 1 &&
    before common/pixel.c '#else // !HIGH_BIT_DEPTH' 'pixf->intra_sa8d_x9_8x8_fdec = x264_intra_sa8d_x9_8x8_fdec_avx512icl;' &&
    pl common/dct.c 's|(        pf_progressive->intra_satd_x9_4x4_mb = x264_intra_satd_x9_4x4_mb_frame_avx2;\n)|$1        if( cpu&X264_CPU_AVX512ICL )\n        {\n            pf_interlaced->intra_satd_x9_4x4_recon  = x264_intra_satd_x9_4x4_recon_field_avx512icl;\n            pf_progressive->intra_satd_x9_4x4_recon = x264_intra_satd_x9_4x4_recon_frame_avx512icl;\n            pf_interlaced->intra_satd_x9_4x4_recon_notr  = x264_intra_satd_x9_4x4_recon_field_notr_avx512icl;\n            pf_progressive->intra_satd_x9_4x4_recon_notr = x264_intra_satd_x9_4x4_recon_frame_notr_avx512icl;\n        }\n|' &&
    want common/dct.c 'pf_progressive->intra_satd_x9_4x4_recon_notr = x264_intra_satd_x9_4x4_recon_frame_notr_avx512icl;' 1
}
