# rack01 job dcrd-zen4: the 4:2:2 chroma dc rd coder (h->bsf.cabac_block_residual_422_dc_rd_internal, reached from
# the rd and trellis paths) on Zen 4. wip/x264-422-dcrd tip fe2db406 dispatches avx2_bmi2 on AVX2 machines, but its
# AVX512 level sets the slot back to NULL: Zen 4 / Zen 5 still run the C. MODE=icl of the branch's
# tools/notes-422-dcrd/ab-422-dcrd.sh, one arm pair per run (AB), at both depths (BITDEPTH):
#   AB=avx2       base fe2db406 (C) -> a02322ce zen5/x264-422-dcrd-avx2 (avx2_bmi2 on every AVX-512 machine)
#   AB=icl2       base fe2db406 (C) -> b14be256 zen5/x264-422-dcrd-icl2 (rd2_avx512icl at AVX512ICL)
#   AB=icl1       base fe2db406 (C) -> 14b473a4 zen5/x264-422-dcrd-icl1 (the avx512icl kernel of 54f7ee3e)
#   AB=icl2-avx2  base a02322ce (avx2_bmi2) -> b14be256 (rd2_avx512icl): head-to-head, only when avx2 and icl2 both
#                 win against the C within 0.3 % of each other
#   BITDEPTH=8    8-bit 4:2:2 (-422 clips); BITDEPTH=10: 10-bit 4:2:2 (-422p10 clips)
# All arms are commits (no patch). 4:2:0 has no 4:2:2 chroma dc: the 4:2:0 clips are md5 cells only (8-bit).
# Null control: 4:2:2 lowlat (veryfast subme 2, trellis 0: zero rd dc calls).
# Verdict decides: which Zen 4/5 dispatch the tip takes for the 4:2:2 dc rd at 8 and 10-bit: the C (the tip as is),
# avx2_bmi2 (a02322ce), rd2_avx512icl (b14be256) or icl1 (14b473a4): the arm with the biggest WIN vs the C at both
# depths; nothing if none wins.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; here the AVX-512 arms ARE their zen5 branches, already pushed with it dispatched:
#   zen5/x264-422-dcrd-icl2 = b14be256, zen5/x264-422-dcrd-icl1 = 14b473a4 (the arm commits): nothing new to create
AB=${AB:-avx2}
BITDEPTH=${BITDEPTH:-8}
case $BITDEPTH in 8) X=422;; 10) X=422p10;; *) echo "dcrd-zen4: BITDEPTH must be 8 or 10" >&2; exit 1;; esac
TIP=fe2db4060ad08602ee5f9d81befc197c35a396f0      # wip/x264-422-dcrd: Zen 4 = C
A2=a02322ce6a55936ada6364ea08c10d913f3f858b       # zen5/x264-422-dcrd-avx2
I2=b14be2562e3aacfc90f2832ca5a5291d0222bc9b       # zen5/x264-422-dcrd-icl2
I1=14b473a4a3eef9b15181b83e59f1ca835b31c23a       # zen5/x264-422-dcrd-icl1
S_A2=cabac_block_residual_422_dc_rd_internal_avx2_bmi2
S_I2=cabac_block_residual_422_dc_rd2_internal_avx512icl
S_I1='cabac_block_residual_422_dc_rd_internal_avx512icl'
case $AB in
avx2)      BASE=$TIP; ARM=$A2; S=$S_A2; ARMDESC="a02322ce (avx2_bmi2 4:2:2 dc rd on AVX-512)"; ZEN5="";;
icl2)      BASE=$TIP; ARM=$I2; S=$S_I2; ARMDESC="b14be256 (rd2_avx512icl 4:2:2 dc rd at AVX512ICL)"
           ZEN5="zen5/x264-422-dcrd-icl2 = b14be256 (the arm commit, already pushed: nothing to create)";;
icl1)      BASE=$TIP; ARM=$I1; S=$S_I1; ARMDESC="14b473a4 (54f7ee3e avx512icl 4:2:2 dc rd at AVX512ICL)"
           ZEN5="zen5/x264-422-dcrd-icl1 = 14b473a4 (the arm commit, already pushed: nothing to create)";;
icl2-avx2) BASE=$A2; ARM=$I2; S=$S_I2; ARMDESC="b14be256 (rd2_avx512icl) vs base a02322ce (avx2_bmi2)"
           ZEN5="zen5/x264-422-dcrd-icl2 = b14be256 (the arm commit, already pushed: nothing to create)";;
*) echo "dcrd-zen4: unknown AB $AB (avx2 icl2 icl1 icl2-avx2)" >&2; exit 1;;
esac
JOB=dcrd-zen4-$AB-${BITDEPTH}b
TITLE="4:2:2 chroma dc rd on Zen 4, $BITDEPTH-bit: AB=$AB"
BRANCHES="wip/x264-422-dcrd zen5/x264-422-dcrd-avx2 zen5/x264-422-dcrd-icl2 zen5/x264-422-dcrd-icl1"
if [ $BITDEPTH = 8 ]; then
    DEF_CLIPLIST="fades-p-422 tile-chaos-p-422 fades-i-422 field-frame-mix-i-422 credits-i-422"
    MD5CLIPS=${MD5CLIPS:-"$DEF_CLIPLIST fades-p tile-chaos-p pan-fast-p fades-i field-frame-mix-i credits-i"}
else
    DEF_CLIPLIST="fades-p-422p10 tile-chaos-p-422p10 fades-i-422p10 field-frame-mix-i-422p10"
    DEF_MD5X=""
fi
DEF_MODES="normal"
DEF_NULLCELLS="tile-chaos-p-$X:lowlat field-frame-mix-i-$X:lowlat"   # md5 still covers every clip x lowlat normal
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p-$X:normal field-frame-mix-i-$X:normal"}
LIVE_SHOW='cabac_block_residual'
if [ $AB = icl2-avx2 ]; then
    LIVE_ASSERT=${LIVE_ASSERT:-"A+:$S_I2 B0:$S_I2 B+:$S_A2 A0:$S_A2"}
else
    LIVE_ASSERT=${LIVE_ASSERT:-"A+:$S B0:422_dc_rd2?_internal"}   # the base runs the C (inlined residual coder)
fi
NULL_ASSERT=${NULL_ASSERT:-'A0:422_dc_rd2?_internal B0:422_dc_rd2?_internal'}
