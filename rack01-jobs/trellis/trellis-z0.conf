# rack01 job trellis-z0: merge-safety gate for wip/x264-nw-trellis on Zen 4. The AVX2 nodes trellis is dispatched
# only where !SLOW_GATHER (Intel Golden/Raptor Cove); AMD always has SLOW_GATHER, so on Zen 4 the branch tip
# 939df094 must run exactly what speed-next 42c3f783 runs: recon md5 SAME and zero *_nodes_avx2 samples.
# Zero-call null control as a whole job: no timing (ALLSTEPS without time).
# Verdict decides: the branch's Intel-only dispatch is a Zen 4 no-op (unblocks the trellis merge on Core 3's verdict).
JOB=trellis-z0
TITLE="trellis: the Intel-only nodes dispatch is a no-op on Zen 4 (Z0 gate)"
BRANCHES="speed-next wip/x264-nw-trellis"
BASE=42c3f783b898a35f8895dbb1341d58e1047c5860
ARM=939df0948187cec0c5da707ac57ecd1574c7d8d8
ARMDESC="939df094 (nodes avx2 dispatched on fast-gather AVX2 only)"
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:normal"}
LIVE_SHOW='trellis'
LIVE_ASSERT=${LIVE_ASSERT:-'A0:nodes_avx2 B0:nodes_avx2 A+:trellis_cabac'}
ALLSTEPS=${ALLSTEPS:-"preflight build check live md5 clean"}
