# rack01 job trellis-z1 (Z1 of wip/x264-nw-trellis): re-judge in situ the avx512icl trellis 4x4 / 4x4_psy / dc /
# 422_dc that a checkasm bench pruned on Zen 4. base = 939df094 (Zen 4: icl 8x8, scalar avx2 4x4/dc), arm = the
# same with the icl 4x4 / 4x4_psy / dc / 422_dc pointers next to the icl 8x8 ones (both bit depths, perl, asserted).
# Replaces core3-jobs/trellis/ab-insitu.sh ARMPATCH=z1 for rack01.
# Null control: lowlat (trellis 0: no trellis calls).
# Verdict decides: restore the icl 4x4/dc dispatch on AVX512ICL (undo the bench prune) or keep scalar avx2.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-trellis-icl4x4 = 939df094 + this job's patch_arm, committed as "zen5: dispatch trellis_cabac_4x4 / 4x4_psy / dc / chroma_422_dc avx512icl"
JOB=trellis-z1
ZEN5="zen5/x264-trellis-icl4x4 = 939df094 + this job's patch_arm, committed as \"zen5: dispatch trellis_cabac_4x4 / 4x4_psy / dc / chroma_422_dc avx512icl\""
TITLE="trellis 4x4/dc: avx512icl vs scalar avx2 on Zen 4 (Z1)"
BRANCHES="wip/x264-nw-trellis"
BASE=939df0948187cec0c5da707ac57ecd1574c7d8d8
ARM=939df0948187cec0c5da707ac57ecd1574c7d8d8
ARMDESC="939df094 with trellis_cabac_4x4 / 4x4_psy / dc / chroma_422_dc = *_avx512icl in both AVX512ICL blocks"
DEF_MODES="normal"
DEF_NULLCELLS="tile-chaos-p:lowlat field-frame-mix-i:lowlat"   # md5 still covers every clip x lowlat normal
LIVE_CELLS=${LIVE_CELLS:-"tile-chaos-p:normal field-frame-mix-i:normal"}
LIVE_SHOW='trellis'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:trellis_cabac_(4x4|dc)(_psy)?_avx512icl B0:trellis_cabac_(4x4|dc)(_psy)?_avx512icl B+:trellis_cabac_(4x4|dc)(_psy)?_avx2 A0:trellis_cabac_(4x4|dc)(_psy)?_avx2'}
NULL_ASSERT=${NULL_ASSERT:-'A0:trellis_cabac B0:trellis_cabac'}
patch_arm() {
    pl common/quant.c 's/^([ ]*)pf->trellis_cabac_8x8_psy = x264_trellis_cabac_8x8_psy_avx512icl;\n/$&$1pf->trellis_cabac_4x4 = x264_trellis_cabac_4x4_avx512icl;\n$1pf->trellis_cabac_4x4_psy = x264_trellis_cabac_4x4_psy_avx512icl;\n$1pf->trellis_cabac_dc = x264_trellis_cabac_dc_avx512icl;\n$1pf->trellis_cabac_chroma_422_dc = x264_trellis_cabac_chroma_422_dc_avx512icl;\n/mg' &&
    want common/quant.c 'pf->trellis_cabac_4x4 = x264_trellis_cabac_4x4_avx512icl;' 2 &&
    want common/quant.c 'pf->trellis_cabac_dc = x264_trellis_cabac_dc_avx512icl;' 2
}
