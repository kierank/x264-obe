# rack01 job cacheload-avx512: wip/x264-nw-cacheload ab419b5c (mb_fref_load avx2, dispatched at AVX2 and inherited
# by Zen 4) vs the same with the undispatched mb_fref_load_avx512 (1720dcb3; zmm stores on 64-byte lines) set in the
# AVX-512 block. Laptop: avx512 7.9 vs avx2 7.6 ticks at 4+2 rows, slower for n <= 2. No null control.
# Verdict decides: dispatch mb_fref_load avx512 on Zen 4/5 or keep avx2.
# ZEN5 RULE (Kieran 11-11, "any failed avx512 needs parking on zen5"): an AVX-512 kernel that loses or ties
# is NOT dropped; the lead (rack01 does not push) creates this zen5 branch, with it dispatched:
#   zen5/x264-cacheload-avx512 = ab419b5c + this job's patch_arm, committed as "zen5: dispatch mb_fref_load_avx512"
JOB=cacheload-avx512
ZEN5="zen5/x264-cacheload-avx512 = ab419b5c + this job's patch_arm, committed as \"zen5: dispatch mb_fref_load_avx512\""
TITLE="cache_load: mb_fref_load avx512 vs avx2"
BRANCHES="wip/x264-nw-cacheload"
BASE=ab419b5c79ae905663f77428f40644a8831c8e20
ARM=ab419b5c79ae905663f77428f40644a8831c8e20
ARMDESC="ab419b5c with pf->mb_fref_load = x264_mb_fref_load_avx512 after the plane_copy avx512 line"
LIVE_CELLS=${LIVE_CELLS:-"field-frame-mix-i:normal tile-chaos-p:lowlat"}
LIVE_SHOW='mb_fref_load|cache_load'
LIVE_ASSERT=${LIVE_ASSERT:-'A+:mb_fref_load_avx512 B0:mb_fref_load_avx512 B+:mb_fref_load_avx2 A0:mb_fref_load_avx2'}
patch_arm() {
    want common/x86/mc-c.c '    pf->plane_copy = x264_plane_copy_avx512;' 1 &&
    pl common/x86/mc-c.c 's/^(    pf->plane_copy = x264_plane_copy_avx512;\n)/$1    pf->mb_fref_load = x264_mb_fref_load_avx512;\n/m' &&
    want common/x86/mc-c.c 'pf->mb_fref_load = x264_mb_fref_load_avx512;' 1
}
